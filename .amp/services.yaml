services:
  site:
    command: pnpm dev --host 0.0.0.0 --port "$PORT"
    port: 4322
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      NODE_OPTIONS: --max-old-space-size=8192
    health: /
    portal:
      title: rockorager.dev — EmDash
      url: /
    portals:
      - title: EmDash editor — dev login
        url: /_emdash/api/setup/dev-bypass?redirect=/_emdash/admin
        description: Local development only. Signs in without a passkey.
