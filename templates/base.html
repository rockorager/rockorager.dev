<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <link rel="canonical" href="{{ current_url | safe }}">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="alternate" type="application/rss+xml" title="rockorager.dev — blog" href="/blog/index.xml">
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            {% set section_name = current_path | split(pat="/") | nth(n=1) %}
            <a href="/"{% if current_path == "/" %} aria-current="page"{% endif %}>home</a>
            <a href="/blog/"{% if section_name == "blog" %} aria-current="{% if current_path == '/blog/' %}page{% else %}location{% endif %}"{% endif %}>blog</a>
            <a href="/misc/"{% if section_name == "misc" %} aria-current="{% if current_path == '/misc/' %}page{% else %}location{% endif %}"{% endif %}>misc</a>
        </nav>
    </header>
    <main>
        {% block main %}{% endblock main %}
    </main>
    {% include "partials/footer.html" %}
</body>
</html>
